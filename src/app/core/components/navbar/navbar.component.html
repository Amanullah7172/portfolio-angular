

<nav [class.navbar-scrolled]="navbarScrolled" class="fixed top-0 left-0 w-full bg-gradient-to-b from-gray-900 to-gray-800/95 backdrop-blur-lg border-b border-gray-800 z-50 shadow-lg transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <button (click)="scrollToTop()" class="flex items-center text-2xl font-bold text-indigo-400 hover:text-indigo-300 transition-all duration-300 bg-transparent border-none cursor-pointer">
        <i class="fa fa-user-circle mr-2"></i> <span class="hidden sm:inline">Portfolio</span>
      </button>

      <!-- Desktop Menu -->
      <ul class="hidden md:flex space-x-8 font-medium">
        <li>
          <button (click)="scrollToSection('hero')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Home</button>
        </li>
        <li>
          <button (click)="scrollToSection('about')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">About</button>
        </li>
        <li>
          <button (click)="scrollToSection('skills')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Skills</button>
        </li>
        <li>
          <button (click)="scrollToSection('services')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Services</button>
        </li>
        <li>
          <button (click)="scrollToSection('projects')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Projects</button>
        </li>
        <li>
          <button (click)="scrollToSection('contact')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Contact</button>
        </li>
      </ul>

      <!-- Mobile Menu Button -->
      <button (click)="isOpen = !isOpen" class="md:hidden text-gray-200 focus:outline-none hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

    </div>

    <!-- Mobile Menu -->
    <div *ngIf="isOpen" class="md:hidden pb-4 bg-gradient-to-b from-gray-900 to-gray-800/95 backdrop-blur-lg animate-in fade-in slide-in-from-top">
      <ul class="flex flex-col items-center space-y-4 font-medium">
        <li><button (click)="scrollToSection('hero')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Home</button></li>
        <li><button (click)="scrollToSection('about')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">About</button></li>
        <li><button (click)="scrollToSection('skills')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Skills</button></li>
        <li><button (click)="scrollToSection('services')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Services</button></li>
        <li><button (click)="scrollToSection('projects')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Projects</button></li>
        <li><button (click)="scrollToSection('contact')" class="text-gray-200 hover:text-indigo-400 transition-all duration-300 bg-transparent border-none cursor-pointer">Contact</button></li>
      </ul>
    </div>
  </div>
</nav>
